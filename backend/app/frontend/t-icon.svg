<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#0D9488" stroke-width="6" stroke-opacity="0.3" />

  <!-- Monogram T Symbol -->
  <g filter="url(#shadow)">
    <!-- Top Horizontal Crossbar -->
    <path d="M 112 112 L 400 112 L 400 196 L 112 196 Z" fill="url(#tGrad)" />
    <!-- Top Chamfer Highlight -->
    <path d="M 112 112 L 400 112 L 400 128 L 112 128 Z" fill="#FFFFFF" fill-opacity="0.35" />
    <!-- Vertical Pillar / Stem -->
    <path d="M 210 196 L 302 196 L 302 400 L 210 400 Z" fill="url(#tGrad)" />
  </g>
</svg>
